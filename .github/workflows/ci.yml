name: THREADYOL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/flaskProject/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: backend/flaskProject
        run: |
          python -m unittest discover -s backend/flaskProject/tests -p 'test_*.py'
