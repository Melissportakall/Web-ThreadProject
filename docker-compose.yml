services:
  postgres:
    image: postgres:16-alpine
    container_name: threadyol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: threadyol
      POSTGRES_USER: threadyol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadyol -d threadyol"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: threadyol-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/flaskProject
    container_name: threadyol-api
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      DATABASE_URL: postgresql+psycopg2://threadyol:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/threadyol
      REDIS_URL: redis://redis:6379/0
      ENABLE_ORDER_WORKER: "true"
    command: gunicorn --bind 0.0.0.0:8000 wsgi:app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
